name: Build
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Check Netlify function and API syntax
        run: |
          node --check netlify/functions/api.js
          for file in api/*.js; do node --check "$file"; done
